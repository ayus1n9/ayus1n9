<svg width="800" height="360" viewBox="0 0 800 360"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="800" height="360" rx="12" fill="#050505"/>

  <!-- Terminal header -->
  <rect width="800" height="38" rx="12" fill="#111111"/>
  <rect y="28" width="800" height="10" fill="#111111"/>

  <!-- Window buttons -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="6" fill="#27c93f"/>

  <text x="400" y="24"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#888888">
    ayus1n9@github — ~/security
  </text>

  <!-- Terminal content -->

  <text x="28" y="72"
        font-family="monospace"
        font-size="16"
        fill="#00ff41">
    $ whoami
  </text>

  <text x="28" y="98"
        font-family="monospace"
        font-size="16"
        fill="#ffffff">
    cybersecurity enthusiast
  </text>

  <text x="28" y="132"
        font-family="monospace"
        font-size="16"
        fill="#00ff41">
    $ cat interests.txt
  </text>

  <text x="28" y="158"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    cloud-security
  </text>

  <text x="220" y="158"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    devsecops
  </text>

  <text x="350" y="158"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    penetration-testing
  </text>

  <text x="28" y="184"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    python
  </text>

  <text x="140" y="184"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    linux
  </text>

  <text x="240" y="184"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    network-security
  </text>
     
  <text x="425" y="184"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    malware-analysis
  </text>

  <text x="28" y="222"
        font-family="monospace"
        font-size="16"
        fill="#00ff41">
    $ systemctl status learning
  </text>

  <text x="28" y="250"
        font-family="monospace"
        font-size="15"
        fill="#ffffff">
    ● learning.service - Continuous Learning
  </text>

  <text x="28" y="274"
        font-family="monospace"
        font-size="15"
        fill="#00ff41">
    Loaded: loaded
  </text>

  <text x="28" y="298"
        font-family="monospace"
        font-size="15"
        fill="#00ff41">
    Active: active (running)
  </text>

  <text x="28" y="328"
        font-family="monospace"
        font-size="16"
        fill="#00ff41">
    $
  </text>

  <!-- Blinking cursor -->
  <rect x="45" y="314" width="9" height="18" fill="#00ff41">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

</svg>
